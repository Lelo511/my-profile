<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Photo gallery of Samkelo Ngcobo - Web Developer & SEO Specialist from Chartwell, Gauteng">
  <meta name="keywords" content="Samkelo Ngcobo, Web Developer, Chartwell, Gauteng, Photos, Gallery">
  <meta name="author" content="Samkelo Ngcobo">
  <title>My Photos | Samkelo Ngcobo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #991b1b; --dark: #0f172a; --gray: #64748b; --light: #f8fafc; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--light); color: var(--dark); }
   .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    
   .header { text-align: center; margin-bottom: 40px; }
   .nav-btn {
      display: inline-block; background: var(--dark); color: white; padding: 12px 20px;
      border-radius: 8px; text-decoration: none; font-weight: 600; margin-bottom: 30px; transition: 0.2s;
    }
   .nav-btn:hover { background: var(--primary); }
    h1 { font-size: 2.5rem; color: var(--dark); margin-bottom: 10px; }
   .subtitle { color: var(--gray); font-size: 1.1rem; }
    
    /* PHOTO GRID */
   .photo-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 20px; 
    }
   .photo-card {
      position: relative; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: 0.3s;
      aspect-ratio: 1; background: #e2e8f0; cursor: pointer;
    }
   .photo-card:hover { transform: scale(1.03); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
   .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
   
   .caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      color: white; padding: 20px 15px 15px; font-weight: 600;
      opacity: 0; transition: 0.3s;
    }
   .photo-card:hover .caption { opacity: 1; }
   
   .empty { 
      text-align: center; color: var(--gray); padding: 80px 20px; 
      grid-column: 1/-1; font-size: 1.1rem;
    }
    
    @media (max-width: 640px) {
      h1 { font-size: 2rem; }
     .photo-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    }
  </style>
</head>
<body style="background: #0f172a;">
  <div class="container">
    <a href="profile.html" class="nav-btn" style="background: rgb(61, 107, 152);">← Back to Profile</a>

    <div class="header">
      <h1 style="color: white;">My Photo Gallery</h1>
      <p class="subtitle" style="color: white;">A collection of my photos and moments</p>
    </div>

    <!-- PHOTOS DISPLAY -->
    <div class="photo-grid" id="photoGrid">
      <!-- Photos will be added here by JavaScript -->
    </div>
  </div>

  <script>
    // ADD YOUR PHOTOS HERE - JUST EDIT THIS LIST
    const myPhotos = [
      {
        src: 'img/3.jpg', // Path to your image file
        caption: 'Samkelo Ngcobo - Web Developer'
      },
      {
        src: 'img/4.jpg',
        caption: 'Working on my latest project'
      },
      {
        src: 'img/2.jpg', 
        caption: 'Chartwell, Gauteng'
      },
      {
        src: 'img/1.jpg',
        caption: ''
      },
      // TO ADD MORE: Copy the block above and change src + caption
    ];

    // This code displays your photos - don't edit below
    document.addEventListener('DOMContentLoaded', function() {
      const photoGrid = document.getElementById('photoGrid');
      
      if (myPhotos.length === 0) {
        photoGrid.innerHTML = '<div class="empty">No photos yet. Add some to the myPhotos list in the code.</div>';
        return;
      }

      myPhotos.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img src="${photo.src}" alt="${photo.caption}" loading="lazy">
          <div class="caption">${photo.caption}</div>
        `;
        photoGrid.appendChild(card);
      });
    });
  </script>
</body>
</html>
